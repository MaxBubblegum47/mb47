baseURL = "https://MaxBubblegum47.github.io/mb47/"
languageCode = "en-us"
title = "Lorenzo Stigliano"
author = "Lorenzo Stigliano"
description = "Portfolio of a C++ engineer specializing in embedded systems, compiler development, and quantum computing"
theme = "trainsh"
defaultContentLanguage = "en"
defaultContentLanguageInSubdir = false
disablePathToLower = false
removePathAccents = true
preserveTaxonomyNames = false

[params]
  mainSections = ["posts"]

  [params.social]
    github = "https://github.com/MaxBubblegum47"
    email = "lorenzo.stigliano@example.com"
    linkedin = "https://linkedin.com/in/lorenzo-stigliano"

[languages]
  [languages.en]
    languageCode = "en-US"
    languageName = "English"
    weight = 1
    title = "Lorenzo Stigliano | C++ Software Engineer"

    [[languages.en.menu.main]]
      name = "Home"
      pageRef = "/"
      weight = 1

    [[languages.en.menu.main]]
      name = "Blog"
      pageRef = "/posts"
      weight = 2

    [[languages.en.menu.main]]
      name = "About"
      pageRef = "/about"
      weight = 3

    [[languages.en.menu.main]]
      name = "Contact"
      pageRef = "/contact"
      weight = 4

[markup]
  [markup.goldmark.renderer]
    unsafe = true

  [markup.goldmark.parser.attribute]
    block = true

  [markup.highlight]
    lineNos = false
    lineNumbersInTable = false
    anchorLineNos = false
    codeFences = true
    lineNoStart = 1
    noClasses = true

[outputs]
  home = ["HTML", "RSS", "JSON"]